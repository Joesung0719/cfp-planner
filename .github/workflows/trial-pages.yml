# 同一個 Pages 站台發佈兩個版本：
#   /          正式版 = main 的 index.html（每次合併到 main 自動更新）
#   /trial/    客戶試用版 = trial/pinned-ref.txt 指定的 commit 或標籤（固定版本，改這個檔才會更新）
# Settings → Pages → Source 需為「GitHub Actions」。
name: Deploy site (formal + trial)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - name: Read pinned trial ref
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < main-src/trial/pinned-ref.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.ref }}
          path: trial-src
      - name: Assemble site
        run: |
          mkdir -p site/trial
          cp main-src/index.html site/index.html
          (cd trial-src && python3 trial/build.py --release)
          cp trial-src/dist/index.html site/trial/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
